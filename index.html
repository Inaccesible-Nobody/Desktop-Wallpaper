<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#453326">
  <title>The Listening Room</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="room" id="room" aria-label="The Listening Room desktop wallpaper">
    <div class="artwork" aria-hidden="true"></div>
    <div class="lamp-light" id="lampLight" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <!-- Interactive hit areas are positioned over the artwork. -->
    <button class="hotspot cassette c1" data-playlist="0" aria-label="Play cassette one" title="Cassette 1"></button>
    <button class="hotspot cassette c2" data-playlist="1" aria-label="Play cassette two" title="Cassette 2"></button>
    <button class="hotspot cassette c3" data-playlist="2" aria-label="Play cassette three" title="Cassette 3"></button>
    <button class="hotspot cassette c4" data-playlist="3" aria-label="Play cassette four" title="Cassette 4"></button>
    <button class="hotspot cassette c5" data-playlist="4" aria-label="Play cassette five" title="Cassette 5"></button>
    <button class="hotspot cassette c6" data-playlist="5" aria-label="Play cassette six" title="Cassette 6"></button>

    <button class="on-air-hit" id="onAirHit" aria-label="ON AIR indicator. Click to stop playback" title="ON AIR"></button>
    <button class="lamp-hit" id="lampToggle" aria-label="Toggle lamp" title="Toggle lamp lighting"></button>
    <button class="boombox-hit" id="boomboxHit" aria-label="Toggle player panel" title="Open or close music player"></button>

    <section class="clock" aria-label="Fuzzy clock">
      <div id="fuzzyTime">it's a little past nine</div>
      <div id="dateLine" class="date-line"></div>
    </section>

    <section class="todo-wrap" aria-label="Editable reminder note">
      <textarea id="todo" aria-label="To-do list" placeholder=""></textarea>
    </section>

    <section class="calendar-live" aria-label="Calendar">
      <span id="month"></span><strong id="day"></strong><span id="weekday"></span>
    </section>

    <div class="folder-guide" title="Place your desktop folders over the empty shelf"></div>

    <section class="player" id="player" hidden aria-label="Spotify player">
      <button id="closePlayer" class="close-player" aria-label="Close player">×</button>
      <div class="player-heading"><span class="tiny-led"></span><span id="playerTitle">NOW PLAYING</span></div>
      <iframe id="spotifyFrame" title="Spotify playlist" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
      <button id="stopPlayback" class="stop-button">STOP / EJECT</button>
    </section>

    <div class="hint" id="hint" aria-live="polite"></div>
  </main>
  <script src="playlists.js"></script>
  <script src="app.js"></script>
</body>
</html>
